<header class="topbar">
  <div class="mobile-brand">
    <span class="mobile-brand__mark">A</span>
    <strong>AnkiFlow</strong>
  </div>

  <label class="search">
    <af-icon name="search" [size]="18" />
    <span class="sr-only">Search</span>
    <input type="search" placeholder="Search decks and cards" />
    <kbd>⌘ K</kbd>
  </label>

  <div class="topbar__actions">
    <af-icon-button label="View notifications">
      <af-icon name="bell" />
    </af-icon-button>
    <div class="profile">
      <af-avatar [name]="displayName()" [size]="42" />
      <div class="profile__copy">
        <strong>{{ displayName() }}</strong>
        <span>Focused learner</span>
      </div>
    </div>
    <af-icon-button label="Sign out" (click)="logout()">
      <af-icon name="arrow-right" />
    </af-icon-button>
  </div>
</header>
