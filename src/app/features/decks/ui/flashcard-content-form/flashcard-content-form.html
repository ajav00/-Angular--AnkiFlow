<section class="content-form" [formGroup]="form()" aria-labelledby="content-title">
  <div class="section-heading">
    <span class="step">1</span>
    <div>
      <span class="eyebrow">Card content</span>
      <h2 id="content-title">Fill the note fields</h2>
      <p>Each field belongs to the selected note type and can later map to an Anki model.</p>
    </div>
  </div>

  <div class="field-list">
    <label class="field">
      <span class="field__label">
        <strong>Front</strong>
        <span class="field__actions">
          <button
            type="button"
            class="translate-button"
            [disabled]="!canTranslate('front')"
            [attr.aria-busy]="translating() === 'front'"
            (mousedown)="$event.preventDefault(); $event.stopPropagation()"
            (click)="translateFrom('front', $event)"
          >
            {{ translating() === 'front' ? 'Translating…' : 'Translate' }}
          </button>
          <span class="field__chip">Required</span>
        </span>
      </span>
      <textarea rows="4" formControlName="front"></textarea>
      <small>Question, word, or phrase shown first.</small>
      @if (frontError()) {
        <small class="field__error">{{ frontError() }}</small>
      }
    </label>

    <label class="field">
      <span class="field__label">
        <strong>Back</strong>
        <span class="field__actions">
          <button
            type="button"
            class="translate-button"
            [disabled]="!canTranslate('back')"
            [attr.aria-busy]="translating() === 'back'"
            (mousedown)="$event.preventDefault(); $event.stopPropagation()"
            (click)="translateFrom('back', $event)"
          >
            {{ translating() === 'back' ? 'Translating…' : 'Translate' }}
          </button>
          <span class="field__chip">Required</span>
        </span>
      </span>
      <textarea rows="4" formControlName="back"></textarea>
      <small>Answer or translation revealed during study.</small>
      @if (backError()) {
        <small class="field__error">{{ backError() }}</small>
      }
    </label>

    <label class="field">
      <span class="field__label">
        <strong>Example</strong>
        <span class="field__chip">Optional</span>
      </span>
      <textarea rows="3" formControlName="example"></textarea>
      <small>Optional sentence that provides context.</small>
    </label>

    <label class="field">
      <span class="field__label">
        <strong>Hint</strong>
        <span class="field__chip">Optional</span>
      </span>
      <input type="text" disabled placeholder="Not saved yet" />
      <small>Not saved yet — hints aren't supported by the backend.</small>
    </label>
  </div>
</section>
