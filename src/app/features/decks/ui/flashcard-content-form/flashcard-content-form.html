<section class="content-form" [formGroup]="form()" aria-labelledby="content-title">
  <div class="section-heading">
    <span class="step">1</span>
    <div>
      <span class="eyebrow">Card content</span>
      <h2 id="content-title">Fill the note fields</h2>
      <p>Each field belongs to the selected note type and can later map to an Anki model.</p>
    </div>
  </div>

  <div class="field-list">
    <label class="field">
      <span class="field__label">
        <strong>Front</strong>
        <span>Required</span>
      </span>
      <textarea rows="4" formControlName="front"></textarea>
      <small>Question, word, or phrase shown first.</small>
    </label>

    <label class="field">
      <span class="field__label">
        <strong>Back</strong>
        <span>Required</span>
      </span>
      <textarea rows="4" formControlName="back"></textarea>
      <small>Answer or translation revealed during study.</small>
    </label>

    <label class="field">
      <span class="field__label">
        <strong>Example</strong>
        <span>Optional</span>
      </span>
      <textarea rows="3" formControlName="example"></textarea>
      <small>Optional sentence that provides context.</small>
    </label>

    <label class="field">
      <span class="field__label">
        <strong>Hint</strong>
        <span>Optional</span>
      </span>
      <input type="text" disabled placeholder="Not saved yet" />
      <small>Not saved yet — hints aren't supported by the backend.</small>
    </label>
  </div>
</section>
