<section class="form-card" aria-labelledby="metadata-title">
  <div class="section-heading">
    <span class="step">1</span>
    <div>
      <span class="eyebrow">Deck basics</span>
      <h2 id="metadata-title">General information</h2>
      <p>Give the collection a clear identity and purpose.</p>
    </div>
  </div>

  <div class="form-grid">
    <label class="field field--wide">
      <span>Deck name</span>
      <input type="text" [value]="deck().title" placeholder="e.g. Everyday English" />
      <small>Use a short name that is easy to recognize.</small>
    </label>

    <label class="field field--wide">
      <span>Description</span>
      <textarea rows="3" [value]="deck().description"></textarea>
      <small>Explain what learners will practice in this deck.</small>
    </label>

    <label class="field">
      <span>Category</span>
      <select>
        <option selected>{{ deck().category }}</option>
        <option>Science</option>
        <option>Professional</option>
        <option>Personal</option>
      </select>
    </label>

    <label class="field">
      <span>Term language</span>
      <select>
        <option selected>{{ deck().termLanguage }}</option>
        <option>Spanish</option>
        <option>Japanese</option>
        <option>Other</option>
      </select>
    </label>

    <label class="field">
      <span>Definition language</span>
      <select>
        <option selected>{{ deck().definitionLanguage }}</option>
        <option>English</option>
        <option>Japanese</option>
        <option>Other</option>
      </select>
    </label>

    <div class="field field--wide">
      <span>Tags</span>
      <div class="tag-input">
        @for (tag of deck().tags; track tag) {
          <span>#{{ tag }} <button type="button" aria-label="Remove {{ tag }}">×</button></span>
        }
        <input type="text" placeholder="Add a tag" aria-label="Add a tag" />
      </div>
      <small>Tags help organize and filter cards across collections.</small>
    </div>
  </div>
</section>
