<af-card class="deck-card">
  <div class="deck-card__accent">
    <span class="deck-card__book">
      <af-icon name="book" [size]="30" />
    </span>
    <af-badge [variant]="badgeVariant()">{{ deck().status }}</af-badge>
  </div>

  <div class="deck-card__body">
    <div class="deck-card__title">
      <div>
        <span class="deck-card__category">{{ deck().category }}</span>
        <h2>{{ deck().title }}</h2>
      </div>
      <button
        type="button"
        [routerLink]="['/decks', deck().id]"
        aria-label="Open {{ deck().title }}"
      >
        <af-icon name="arrow-right" [size]="18" />
      </button>
    </div>

    <p>{{ deck().description }}</p>

    <span class="deck-card__languages">
      {{ deck().termLanguage }} → {{ deck().definitionLanguage }}
    </span>

    <div class="deck-card__progress">
      <span>Mastery</span>
      <strong>{{ deck().masteryPercentage }}%</strong>
    </div>
    <af-progress-bar [value]="deck().masteryPercentage" [label]="deck().title + ' mastery'" />

    <div class="deck-card__footer">
      <span
        ><strong>{{ deck().cardCount }}</strong> cards</span
      >
      <span [class.deck-card__due--empty]="deck().dueCount === 0">
        <strong>{{ deck().dueCount }}</strong> due
      </span>
      <span>{{ deck().lastStudiedLabel }}</span>
    </div>

    <a class="deck-card__study" [routerLink]="['/study', deck().id]">
      <af-icon name="study" [size]="16" />
      Study now
    </a>
  </div>
</af-card>
