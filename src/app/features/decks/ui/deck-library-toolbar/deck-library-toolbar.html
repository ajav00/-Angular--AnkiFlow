<div class="toolbar" aria-label="Deck library controls">
  <label class="search">
    <af-icon name="search" [size]="18" />
    <span class="sr-only">Search decks</span>
    <input type="search" placeholder="Search your decks" />
  </label>

  <div class="toolbar__filters">
    <label>
      <span class="sr-only">Filter by category</span>
      <select>
        <option>All categories</option>
        <option>Language</option>
        <option>Science</option>
        <option>Professional</option>
        <option>Personal</option>
      </select>
    </label>

    <label>
      <span class="sr-only">Sort decks</span>
      <select>
        <option>Recently studied</option>
        <option>Most cards</option>
        <option>Most due</option>
        <option>Highest mastery</option>
      </select>
    </label>
  </div>
</div>
