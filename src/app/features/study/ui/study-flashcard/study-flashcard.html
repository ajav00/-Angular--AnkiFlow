<article class="flashcard" aria-label="Flashcard">
  <section class="flashcard__face flashcard__face--front">
    <div class="face-label">
      <span>Front</span>
    </div>

    <h1>{{ card().front }}</h1>
  </section>

  @if (!revealed()) {
    <button type="button" class="reveal-button" (click)="reveal.emit()">
      <af-icon name="sparkles" [size]="16" />
      Show answer
    </button>
  } @else {
    <div class="reveal-divider">
      <span>Answer revealed</span>
    </div>

    <section class="flashcard__face flashcard__face--back">
      <div class="face-label">
        <span>Back</span>
      </div>

      <h2>{{ card().back }}</h2>

      @if (card().example) {
        <p>{{ card().example }}</p>
      }
    </section>
  }
</article>
