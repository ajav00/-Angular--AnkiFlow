<af-card class="activity">
  <div class="activity__header">
    <div>
      <span class="eyebrow">Consistency</span>
      <h2>Your study rhythm</h2>
    </div>
    <div class="legend" aria-label="Activity intensity legend">
      <span>Less</span>
      @for (level of levels; track level) {
        <i [class]="'cell cell--' + level"></i>
      }
      <span>More</span>
    </div>
  </div>

  <div class="heatmap" [attr.aria-label]="'Study activity from ' + rangeLabel()">
    @for (day of activity(); track day.date) {
      <span
        [class]="'cell cell--' + day.intensity"
        [title]="day.date + ': ' + day.reviewCount + ' sessions'"
      ></span>
    }
  </div>

  <p>
    You studied on <strong>{{ daysStudied() }} days</strong> between {{ rangeLabel() }}.
  </p>
</af-card>
