<div class="login-page">
  <af-card class="login-card">
    <a class="brand" routerLink="/">
      <span class="brand__mark" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="brand__name">AnkiFlow</span>
    </a>

    <span class="eyebrow">Welcome back</span>
    <h1>Sign in to AnkiFlow</h1>
    <p>Keep your study streak going.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Username</span>
        <input type="text" formControlName="userName" autocomplete="username" />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <af-button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
        <af-icon name="arrow-right" [size]="18" />
      </af-button>
    </form>

    <p class="switch-link">
      Don't have an account? <a routerLink="/login/register">Create one</a>
    </p>
  </af-card>
</div>
